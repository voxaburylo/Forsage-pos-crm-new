services:
  - type: web
    name: forsage-api
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter server build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    autoDeploy: true
