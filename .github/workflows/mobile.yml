name: Mobile app

# Застосунок «Форсаж» для телефона (apps/mobile). Запускається лише вручну: Actions → Mobile app → Run workflow.
# Android: на виході файл APK, який ставиться на телефон напряму. iOS: перевірка, що проєкт збирається (без підпису —
# для встановлення на iPhone потрібен обліковий запис Apple Developer; див. apps/mobile/README.md).
#
# Екрани застосунку збираються з тими самими публічними налаштуваннями, що й веб: адреса Supabase і публічний ключ.
# Вони мають лежати у змінних репозиторію (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Що збирати'
        type: choice
        default: android
        options: [android, ios, both]

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_API_URL: https://forsage-pos-crm-new-web.vercel.app

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Settings are present
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Немає змінних VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)"; exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Screens for the app
        run: pnpm --filter mobile run build:web
      - name: Copy screens into the Android project
        working-directory: apps/mobile
        run: npx cap sync android
      # Постійний ключ підпису — у секретах репозиторію; без нього збірка не робиться: тимчасовий підпис не дає оновлювати.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Немає секрету ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forsage.p12"
          echo "FORSAGE_KEYSTORE_FILE=$RUNNER_TEMP/forsage.p12" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          FORSAGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Forsage-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: forsage-android
          path: ${{ runner.temp }}/Forsage-android.apk
          if-no-files-found: error

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Screens for the app
        run: pnpm --filter mobile run build:web
      # Проєкт iOS не лежить у репозиторії: його створює ця збірка (сканер підтримує лише CocoaPods).
      - name: Create the iOS project
        working-directory: apps/mobile
        run: |
          # Сканер (ML Kit) вимагає iOS 15.5+, а новий проєкт створюється з нижчою версією — тому перше встановлення
          # залежностей падає; версію піднімаємо й ставимо залежності ще раз (cap sync нижче).
          npx cap add ios --packagemanager CocoaPods || true
          test -f ios/App/Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Камера потрібна, щоб зчитувати штрихкоди товарів.'" ios/App/App/Info.plist
          npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: apps/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' IPHONEOS_DEPLOYMENT_TARGET=15.5 CODE_SIGNING_ALLOWED=NO build | tail -40
