name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: test-anon-key
  VITE_API_URL: https://example.test
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_KEY: test-service-key-not-a-secret
  JWT_SECRET: test-only-not-production
# 22.11.2026: один послідовний ланцюжок ішов 22–31 хв (з них «pnpm verify» — 21 хв), і про падіння
# дізнавались через ~27 хв. Те саме тепер іде паралельно: веб, каса, сервер (дві половини) і смоки.
# Склад перевірок не змінено: typecheck + lint + усі тести = колишній «pnpm verify»; смоки — ті самі кроки.
# Підсумкове завдання «verify» зелене лише тоді, коли зелені всі частини.
jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=web typecheck
      - run: pnpm --filter=web lint
      - run: pnpm --filter=web test

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=desktop typecheck
      - run: pnpm --filter=desktop test

  server:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=server typecheck
        if: matrix.shard == 1
      - run: pnpm typecheck:api
        if: matrix.shard == 1
      - run: pnpm --filter=server exec vitest run --shard=${{ matrix.shard }}/2

  smokes:
    runs-on: windows-latest
    # Allow for serial SQLite/PGlite and native/UI probes on slower hosted runners.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web build
        env:
          FORSAGE_DESKTOP_BUILD: '1'
      - run: pnpm --filter desktop build
      - run: node apps/desktop/scripts/embed-renderer.cjs
      - run: node apps/desktop/scripts/build-info.cjs
      - run: node apps/desktop/scripts/verify-build.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/lan-first-run-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/catalog-cleanup-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-photos-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-crash-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-restore-crash-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-restore-lock-smoke.cjs
      - run: node apps/desktop/scripts/backup-restore-electron-smoke.cjs --synthetic
      - run: node apps/desktop/scripts/release-crash-smoke.cjs
      - run: node apps/desktop/scripts/readiness-crash-smoke.cjs
      - run: pnpm exec playwright install chromium
      - run: node apps/web/scripts/shift-close-smoke.mjs
      - run: node apps/web/scripts/lan-first-run-ui-smoke.mjs
      - run: node apps/web/scripts/lan-background-ui-smoke.mjs
      - run: node apps/web/scripts/dashboard-readiness-smoke.mjs
      - run: node apps/web/scripts/abc-readiness-smoke.mjs
      - run: node apps/web/scripts/staff-readiness-smoke.mjs
      - run: node apps/web/scripts/sold-readiness-smoke.mjs
      - run: node apps/web/scripts/pos-discount-payment-ui-smoke.mjs
      - run: node apps/web/scripts/readiness-ui-smoke.mjs
      - run: node apps/web/scripts/invoice-search-ui-smoke.mjs
      - run: node apps/web/scripts/invoice-revision-ui-smoke.mjs
      - run: node apps/web/scripts/inventory-revision-ui-smoke.mjs
      - run: node apps/web/scripts/writeoff-return-ui-smoke.mjs
      - run: node apps/web/scripts/warehouse-action-ui-smoke.mjs
      - run: node apps/web/scripts/order-form-recovery-ui-smoke.mjs
      - run: node apps/web/scripts/orders-photo-ui-smoke.mjs
      - run: node apps/web/scripts/ai-image-preparation-smoke.mjs
      - run: node apps/web/scripts/access-race-ui-smoke.mjs
      - run: node apps/web/scripts/customer-staff-action-ui-smoke.mjs
      - run: node apps/web/scripts/payroll-action-ui-smoke.mjs
      - run: node apps/web/scripts/navigation-resource-smoke.mjs
      - run: node apps/web/scripts/catalog-edit-ui-smoke.mjs
      - run: node apps/web/scripts/product-photo-ui-smoke.mjs
      - run: node apps/web/scripts/stability-ui-smoke.mjs
      - run: node apps/web/scripts/tire-service-ui-smoke.mjs
      - run: node apps/web/scripts/ai-supply-input-ui-smoke.mjs
      - run: node apps/web/scripts/ai-invoice-review-ui-smoke.mjs
      - run: node apps/web/scripts/catalog-agent-safety-ui-smoke.mjs
      - run: node apps/web/scripts/catalog-cleanup-ui-smoke.mjs
      - run: node apps/web/scripts/customer-creation-ui-smoke.mjs
      - run: node apps/web/scripts/customer-card-ui-smoke.mjs
      - run: node apps/web/scripts/dialog-escape-ui-smoke.mjs
      - run: node apps/web/scripts/pos-dialog-ui-smoke.mjs
      - run: node apps/web/scripts/pos-usability-ui-smoke.mjs
      - run: node apps/web/scripts/receipt-search-contract-ui-smoke.mjs
      - run: node apps/web/scripts/sale-history-ui-smoke.mjs
      - run: node apps/web/scripts/report-context-ui-smoke.mjs
      - run: node apps/web/scripts/invoice-usability-ui-smoke.mjs
      - run: node apps/web/scripts/product-reference-ui-smoke.mjs
      - run: node apps/web/scripts/order-usability-ui-smoke.mjs
      - run: node apps/web/scripts/web-order-form-ui-smoke.mjs
      - run: node apps/web/scripts/web-invoice-photo-ui-smoke.mjs
      - run: pnpm --filter desktop exec electron scripts/ai-input-renderer-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/ai-invoice-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/receiving-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/inventory-lifecycle-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/writeoff-return-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/supplier-catalog-reference-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/product-detail-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/warehouse-recovery-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/order-save-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/order-resources-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/staff-lifecycle-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/daily-access-smoke.cjs
      - run: node apps/desktop/scripts/blackbox-storage-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/blackbox-ui-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/print-render-smoke.cjs --software
      - run: node apps/web/scripts/receipt-layout-ui-smoke.mjs
      - run: node apps/desktop/scripts/portable-lifecycle-smoke.cjs

  verify:
    if: always()
    needs: [web, desktop, server, smokes]
    runs-on: ubuntu-latest
    steps:
      - name: All parts passed
        run: |
          echo "web=${{ needs.web.result }} desktop=${{ needs.desktop.result }} server=${{ needs.server.result }} smokes=${{ needs.smokes.result }}"
          test "${{ needs.web.result }}" = success
          test "${{ needs.desktop.result }}" = success
          test "${{ needs.server.result }}" = success
          test "${{ needs.smokes.result }}" = success
