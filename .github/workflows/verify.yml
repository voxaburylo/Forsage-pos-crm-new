name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_API_URL: https://example.test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-service-key-not-a-secret
      JWT_SECRET: test-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm --filter web build
        env:
          FORSAGE_DESKTOP_BUILD: '1'
      - run: pnpm --filter desktop build
      - run: node apps/desktop/scripts/embed-renderer.cjs
      - run: node apps/desktop/scripts/build-info.cjs
      - run: node apps/desktop/scripts/verify-build.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/backup-crash-smoke.cjs
      - run: node apps/desktop/scripts/release-crash-smoke.cjs
      - run: node apps/desktop/scripts/readiness-crash-smoke.cjs
      - run: pnpm exec playwright install chromium
      - run: node apps/web/scripts/shift-close-smoke.mjs
      - run: node apps/web/scripts/dashboard-readiness-smoke.mjs
      - run: node apps/web/scripts/abc-readiness-smoke.mjs
      - run: node apps/web/scripts/staff-readiness-smoke.mjs
      - run: node apps/web/scripts/sold-readiness-smoke.mjs
      - run: node apps/web/scripts/pos-discount-payment-ui-smoke.mjs
      - run: node apps/web/scripts/readiness-ui-smoke.mjs
      - run: node apps/web/scripts/invoice-search-ui-smoke.mjs
      - run: node apps/web/scripts/invoice-revision-ui-smoke.mjs
      - run: node apps/web/scripts/inventory-revision-ui-smoke.mjs
      - run: node apps/web/scripts/writeoff-return-ui-smoke.mjs
      - run: node apps/web/scripts/warehouse-action-ui-smoke.mjs
      - run: node apps/web/scripts/order-form-recovery-ui-smoke.mjs
      - run: node apps/web/scripts/orders-photo-ui-smoke.mjs
      - run: node apps/web/scripts/ai-image-preparation-smoke.mjs
      - run: node apps/web/scripts/access-race-ui-smoke.mjs
      - run: node apps/web/scripts/customer-staff-action-ui-smoke.mjs
      - run: node apps/web/scripts/payroll-action-ui-smoke.mjs
      - run: node apps/web/scripts/navigation-resource-smoke.mjs
      - run: node apps/web/scripts/catalog-edit-ui-smoke.mjs
      - run: node apps/web/scripts/product-photo-ui-smoke.mjs
      - run: node apps/web/scripts/stability-ui-smoke.mjs
      - run: node apps/web/scripts/tire-service-ui-smoke.mjs
      - run: node apps/web/scripts/ai-supply-input-ui-smoke.mjs
      - run: node apps/web/scripts/ai-invoice-review-ui-smoke.mjs
      - run: node apps/web/scripts/catalog-agent-safety-ui-smoke.mjs
      - run: pnpm --filter desktop exec electron scripts/ai-input-renderer-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/ai-invoice-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/receiving-worker-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/inventory-lifecycle-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/writeoff-return-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/product-detail-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/warehouse-recovery-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/order-save-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/order-resources-smoke.cjs
      - run: pnpm --filter desktop exec cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/staff-lifecycle-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/daily-access-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/blackbox-ui-smoke.cjs
      - run: pnpm --filter desktop exec electron scripts/print-render-smoke.cjs --software
      - run: node apps/web/scripts/receipt-layout-ui-smoke.mjs
      - run: node apps/desktop/scripts/portable-lifecycle-smoke.cjs
